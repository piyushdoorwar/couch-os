# Copy to config/local.properties. Plain UTF-8 key=value, no shell syntax/quotes.
# Keep every real device value here only. Blank means not configured.
tv.host=
adb.connect.port=
# Android 11+ wireless pairing if offered by this firmware; otherwise leave blank.
adb.pair.port=
adb.pair.code=
# Filled after reading getprop, never guessed from the retail model name.
tv.expected.model=
# Comma-separated exact package names, in display order. No default personal apps.
launcher.favourites=
weather.latitude=
weather.longitude=
# Optional exported, on-device tested component: package.name/.Activity
inputs.component=
# Optional tested intent action if the firmware exposes an input picker by action.
inputs.action=
# Only after the runbook's investigation; false leaves voice handling to the OS.
voice.helper.enabled=false
# All package roles below require on-device verification.
stock.launcher.package=
fallback.package=
# Set true only if inspection proves this firmware has no setup fallback.
fallback.verified.absent=false
# A comma-separated subset of the public policy's disable candidates.
verified.disable.packages=
# Additional critical OEM/ambient/voice/input packages discovered on this firmware.
protected.packages=
# Both gates become true ONLY after inventory and physical remote checks.
# Only if OS HOME role is Couch OS but the verified stock HOME still wins by priority.
# See runbook: this does not bypass the requirement to select Couch OS as HOME.
verification.stock.home.priority.checked=false
verification.complete=false
verification.voice.ambient.checked=false
